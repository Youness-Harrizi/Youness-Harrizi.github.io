<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">{{ site.title | escape }}</li>
          <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        <ul class="social-media-list">
          {%- if site.github_username -%}
          <li><a href="https://github.com/{{ site.github_username }}"><svg class="svg-icon"><use xlink:href="{{ '/assets/main.css' | relative_url }}#svg-github"></use></svg> <span class="username">{{ site.github_username }}</span></a></li>
          {%- endif -%}
          {%- if site.linkedin_username -%}
          <li><a href="https://linkedin.com/in/{{ site.linkedin_username }}"><svg class="svg-icon"><use xlink:href="{{ '/assets/main.css' | relative_url }}#svg-linkedin"></use></svg> <span class="username">{{ site.linkedin_username }}</span></a></li>
          {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-3">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>
  </div>
</footer>
